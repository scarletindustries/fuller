name = "fuller"
version = "0.1.0"
target = "erlang"
description = "React server rendering from Gleam: react-dom/server compiled to Erlang by Arc's AOT compiler"
licences = ["Apache-2.0"]
repository = { type = "github", user = "scarletindustries", repo = "fuller" }

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
arc = { git = "https://github.com/alii/arc", ref = "02980f68f1e40212902df96783a0d22697540015" }
carder = { git = "https://github.com/scarletindustries/carder", ref = "e5af691f3bcca85440876017c2450ffa71e70ec9" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
