name = "fuller"
version = "0.1.0"
target = "erlang"
description = "React server rendering from Gleam: react-dom/server compiled to Erlang by Arc's AOT compiler"
licences = ["Apache-2.0"]
repository = { type = "github", user = "scarletindustries", repo = "fuller" }

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
arc = { git = "https://github.com/alii/arc", ref = "7d18c9aab6eb6ecf780879bf6ef691e5e61f7bdb" }
carder = { git = "https://github.com/scarletindustries/carder", ref = "7928eb9242a9eb2acf9b93038f8d163bd196d0ec" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
